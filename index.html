<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);display:flex;justify-content:center;padding:14px 12px 48px}
.credit{text-align:center;color:var(--mut);font-size:13px;line-height:1.5;margin-top:8px}.credit a{color:inherit}
main{width:min(100%,960px);display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 14px;color:var(--mut);font-size:15px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:14px}
.seg button{font-size:15px;padding:6px 12px;border-radius:6px;font-weight:600}
.seg button[aria-pressed=true]{border-color:#2fd6ff;color:#2fd6ff;background:linear-gradient(#17394a,#0e202a)}
.top b{color:var(--txt);font-size:20px;font-weight:700}

#clr .ja{color:var(--mut);font-size:clamp(13px,2.2vw,16px);margin-top:4px}

#pfd{width:100%;height:auto;display:block;border-radius:6px;background:#000;font-family:var(--font)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;font-weight:700;font-size:clamp(17px,3.2vw,24px);padding:14px 4px;border-radius:8px 8px 3px 3px;border:1px solid #5a626d;color:#fff;background:linear-gradient(#323840,#171a1e);cursor:pointer}
button:hover:not(:disabled){border-color:#2fd6ff;color:#2fd6ff}
button:focus-visible{outline:3px solid #2fd6ff;outline-offset:2px}
button:disabled{cursor:default;opacity:.5}
button.right{border-color:#35e07f;color:#35e07f;opacity:1;background:linear-gradient(#1c4a30,#102418)}
button.wrong{border-color:#ff6b6f;color:#ff6b6f;opacity:1;background:linear-gradient(#55242a,#2a1215)}
#res{display:none;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px 18px;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
#res.show{display:grid}
#verdict{font-size:26px;font-weight:700;margin-bottom:8px}
#why{color:var(--mut);font-size:16px;line-height:1.65}
#dia{width:100%;background:#0a0f16;border-radius:8px;border:1px solid var(--edge)}
#next{margin-top:14px;padding:12px 26px;font-size:18px;border-radius:8px;border-color:#2fd6ff}
@media (max-width:700px){#res.show{display:block}#dia{margin-top:12px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#101820;color:#fff;border:1px solid #2fd6ff;border-radius:10px;padding:10px 18px;font-size:17px;opacity:0;transition:.35s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0);opacity:1}100%{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}.cf{position:fixed;top:0;z-index:8;pointer-events:none;animation:fall var(--dur) ease-in forwards;font-size:26px}
</style>
</head>

  <svg id="dia" viewBox="-300 -300 640 640"></svg>
